services:
  - type: web
    name: pdf-chatbot-backend
    env: python
    plan: standard
    rootDir: .
    buildCommand: poetry install --no-interaction --no-ansi
    startCommand: poetry run python app/server.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://pdfs-chatbot.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: worker
    name: pdf-chatbot-worker
    env: python
    plan: standard
    rootDir: .
    buildCommand: poetry install --no-interaction --no-ansi
    startCommand: poetry run python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: static
    name: pdf-chatbot-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://pdf-chatbot-backend-xs1x.onrender.com
      - key: REACT_APP_BACKEND_URL
        value: https://pdf-chatbot-backend-xs1x.onrender.com